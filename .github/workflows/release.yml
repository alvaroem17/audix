name: Compilar y publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            platform: windows
            rust_targets: x86_64-pc-windows-msvc
          - os: macos-latest
            label: macos-universal
            platform: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      # El CLI oficial de npm viene ya compilado; con cargo install tardaría minutos.
      - name: Instalar el CLI de Tauri
        run: npm install -g @tauri-apps/cli@^2

      - name: Poner la versión de la etiqueta en la app
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python3 scripts/set-version.py "${{ github.ref_name }}"

      - name: Tests del backend
        working-directory: src-tauri
        run: cargo test --release

      # La app descarga ffmpeg y yt-dlp al primer arranque. Si esas URLs dejan de
      # servir, la versión publicada no funcionaría para nadie: mejor fallar aquí.
      - name: Comprobar las descargas de herramientas
        shell: bash
        run: ./scripts/check-tools.sh ${{ matrix.platform }}

      - name: Compilar instalador (Windows)
        if: matrix.platform == 'windows'
        run: tauri build --bundles nsis

      - name: Compilar instalador (macOS)
        if: matrix.platform == 'macos'
        run: tauri build --target universal-apple-darwin --bundles dmg

      - name: Recoger el instalador
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe \
               "dist/Audix-${{ github.ref_name }}-windows-x64-instalador.exe"
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
               "dist/Audix-${{ github.ref_name }}-macos-universal.dmg"
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -lh dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "$REPO" \
            --title "Audix ${{ github.ref_name }}" \
            --generate-notes
