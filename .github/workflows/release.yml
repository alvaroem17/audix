name: Compilar y publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            platform: windows
            rust_targets: x86_64-pc-windows-msvc
          - os: macos-latest
            label: macos-universal
            platform: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      # El CLI oficial de npm viene ya compilado; con cargo install tardaría minutos.
      - name: Instalar el CLI de Tauri
        run: npm install -g @tauri-apps/cli@^2

      - name: Poner la versión de la etiqueta en la app
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python3 scripts/set-version.py "${{ github.ref_name }}"

      - name: Tests del backend
        working-directory: src-tauri
        run: cargo test --release

      - name: Descargar ffmpeg y yt-dlp
        shell: bash
        run: ./scripts/fetch-tools.sh ${{ matrix.platform }}

      # Instalador: sin herramientas dentro, las ofrece al primer arranque.
      - name: Compilar instalador (Windows)
        if: matrix.platform == 'windows'
        run: tauri build --bundles nsis

      - name: Compilar instalador (macOS)
        if: matrix.platform == 'macos'
        run: tauri build --target universal-apple-darwin --bundles dmg

      # Portable: reaprovecha lo ya compilado y mete ffmpeg y yt-dlp al lado.
      - name: Empaquetar portable (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p pack/Audix dist
          cp src-tauri/target/release/audix.exe pack/Audix/Audix.exe
          cp -r src-tauri/bin pack/Audix/bin
          cp PORTABLE.txt pack/Audix/LEEME.txt
          (cd pack && 7z a -tzip "../dist/Audix-${{ github.ref_name }}-windows-x64-portable.zip" Audix)
          cp src-tauri/target/release/bundle/nsis/*-setup.exe \
             "dist/Audix-${{ github.ref_name }}-windows-x64-instalador.exe"

      - name: Empaquetar portable (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          tauri build --target universal-apple-darwin --bundles app \
            --config '{"bundle":{"resources":["bin/*"]}}'
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Audix.app
          # Sin esto el portable saldría sin ffmpeg y fallaría al convertir.
          test -x "$APP/Contents/Resources/bin/ffmpeg"
          test -x "$APP/Contents/Resources/bin/yt-dlp"
          mkdir -p pack dist
          cp -R "$APP" pack/
          cp PORTABLE.txt pack/LEEME.txt
          (cd pack && zip -qry "../dist/Audix-${{ github.ref_name }}-macos-universal-portable.zip" .)
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
             "dist/Audix-${{ github.ref_name }}-macos-universal-instalador.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -lh dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "$REPO" \
            --title "Audix ${{ github.ref_name }}" \
            --generate-notes
