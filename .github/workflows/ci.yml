name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formato
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Primero en una máquina sin ffmpeg ni yt-dlp, como la de cualquiera que
      # instale la app desde cero: los tests deben saltarse lo que no puedan
      # probar, nunca dar por hecho que las herramientas están.
      - name: Tests sin herramientas instaladas
        working-directory: src-tauri
        run: cargo test

      - name: Instalar ffmpeg y yt-dlp
        run: |
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL -o /usr/local/bin/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          sudo chmod +x /usr/local/bin/yt-dlp

      # Y ahora con ellas, que es cuando se ejecutan de verdad la conversión y
      # la comprobación de la plantilla de salida.
      - name: Tests con herramientas
        working-directory: src-tauri
        run: cargo test
