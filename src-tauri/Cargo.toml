[package]
name = "audix"
version = "0.1.0"
edition = "2021"
description = "Convierte vídeos a audio y descarga de YouTube"
authors = ["alvaroem17"]
license = "MIT"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
